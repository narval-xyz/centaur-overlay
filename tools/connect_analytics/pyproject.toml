[project]
name = "connect-analytics"
version = "0.1.0"
description = "Read Narval Connect analytics from the production Armory API"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
connect-analytics = "centaur_tool_connect_analytics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [".env.example", ".env"]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_connect_analytics"

[tool.centaur]
module = "client.py"
secrets = [
    { type = "http", name = "CONNECT_ANALYTICS_API_KEY", match_headers = ["x-api-key"], hosts = ["api.narval.xyz"] },
]
